<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FalakHub - Kontrol Hilal</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-top: 50px;
            background-color: #f4f7f6;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: #218838; 
        }
        #status { 
            margin-top: 20px; 
            color: #333; 
            font-size: 16px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FalakHub Tracker Control</h1>
        <p>Tekan tombol di bawah untuk mengarahkan teleskop/kamera ke posisi Hilal.</p>
        <button id="btn-point">Arahkan Hilal</button>
        <p id="status">Status: Menunggu instruksi...</p>
    </div>

    <script>
        const btnPoint = document.getElementById('btn-point');
        const statusText = document.getElementById('status');

        btnPoint.addEventListener('click', async () => {
            // Data JSON tiruan (mock data target azimuth dan altitude)
            const mockData = {
                target_azimuth: 295.45,
                target_altitude: 6.12
            };

            statusText.innerText = "Status: Mengirim perintah ke Server...";
            statusText.style.color = "blue";

            try {
                // Endpoint REST API backend FastAPI
                // Sesuaikan 'localhost:8000' jika host/port berbeda saat deployment
                const response = await fetch('http://localhost:8000/api/point-hilal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(mockData)
                });

                const result = await response.json();
                
                if (response.ok) {
                    statusText.style.color = "green";
                    statusText.innerText = `Status: Berhasil!\nPerintah POINT_HILAL diteruskan ke ESP32.\nTarget: Azimuth ${mockData.target_azimuth}°, Altitude ${mockData.target_altitude}°`;
                } else {
                    statusText.style.color = "red";
                    statusText.innerText = `Status: Gagal dari Server.\nError: ${JSON.stringify(result)}`;
                }
            } catch (error) {
                console.error("Error:", error);
                statusText.style.color = "red";
                statusText.innerText = "Status: Terjadi kesalahan jaringan.\nPastikan Backend FastAPI sedang berjalan.";
            }
        });
    </script>
</body>
</html>
